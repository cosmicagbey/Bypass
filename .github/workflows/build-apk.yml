name: Build & Release Bypass APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.keystore -alias bypass -keyalg RSA -keysize 2048 -validity 10000 -storepass bypasskeystore -keypass bypasskeystore -dname "CN=Bypass, OU=App, O=Bypass, L=City, ST=State, C=US"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Bypass.apk
            echo "Found Release APK at $APK_PATH -> copied to build-output/Bypass.apk"
          else
            echo "Release APK not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-APK
          path: build-output/Bypass.apk
          retention-days: 30

      - name: Publish or Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bypass v1.0.2 (Latest APK)"
          body: |
            ### ⚡ Bypass Android APK v1.0.2
            - **Background Persistence:** Floating bubble remains active on screen even after closing/swiping away Bypass from recent apps.
            - **Toggle Slide Animation:** Tapping the bubble expands the platform list; tapping it again (or tapping outside) smoothly slides the platforms back inside.
            - **Stylish Platform Popups:** Redesigned animated card with vibrant platform badges, subtle tinting, bold typography, and smooth cascade entry.
            - **Background Battery Helper:** Added one-tap background battery optimization request so aggressive task killers (Tecno HiOS, Infinix XOS, Samsung, MIUI) don't dismiss the bubble.
            - **Universal Compatibility:** Signed release APK supporting Android 7.0 through Android 14.
            - **Direct APK Download:** Tap **`Bypass.apk`** below to download and install directly.
          files: build-output/Bypass.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
