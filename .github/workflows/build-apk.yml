name: Build & Release Bypass APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.keystore -alias bypass -keyalg RSA -keysize 2048 -validity 10000 -storepass bypasskeystore -keypass bypasskeystore -dname "CN=Bypass, OU=App, O=Bypass, L=City, ST=State, C=US"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Bypass.apk
            echo "Found Release APK at $APK_PATH -> copied to build-output/Bypass.apk"
          else
            echo "Release APK not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-APK
          path: build-output/Bypass.apk
          retention-days: 30

      - name: Publish or Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bypass v1.0.8 (Latest APK)"
          body: |
            ### ⚡ Bypass Android APK v1.0.8
            - **Edge Docking & Idle Dimming:** Floating icon now rests flush against the edge of the screen (0px gap). After 2.5s of inactivity, it tucks ~50% of its body behind the bezel and dims down. Tapping it smoothly restores full color and pops it out.
            - **Instant Gallery Visibility:** Downloaded videos now save to `Movies/Bypass/` and are automatically scanned into Android's `MediaStore`. They now appear immediately in your phone's Gallery, Google Photos, Samsung Gallery, and under the dedicated "Bypass" album.
            - **Ad & Redirect Killer:** Neutralizes aggressive popups (`window.open`) and blocks third-party ad redirects.
            - **Capture-Phase Download Interceptor:** Captures download taps before ad scripts can run, routing straight to Android's DownloadManager.
            - **Auto-Closing Mini-Browser:** Closes the mini-browser automatically ~800ms after download starts.
            - **Background Notifications:** Persistent `DownloadReceiver` notifies you when your video finishes downloading, with direct tap-to-watch access.
            - **Radial Fan-out Menu & Real Brand Logos:** Blooming arc with official **X (Twitter)**, **TikTok**, **Facebook**, **Instagram**, and **YouTube** logos.
            - **Direct APK Download:** Tap **`Bypass.apk`** below to download and install.
          files: build-output/Bypass.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
