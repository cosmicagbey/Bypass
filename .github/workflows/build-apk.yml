name: Build & Release Bypass APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.keystore -alias bypass -keyalg RSA -keysize 2048 -validity 10000 -storepass bypasskeystore -keypass bypasskeystore -dname "CN=Bypass, OU=App, O=Bypass, L=City, ST=State, C=US"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Bypass.apk
            echo "Found Release APK at $APK_PATH -> copied to build-output/Bypass.apk"
          else
            echo "Release APK not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-APK
          path: build-output/Bypass.apk
          retention-days: 30

      - name: Publish or Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bypass v1.0.3 (Latest APK)"
          body: |
            ### ⚡ Bypass Android APK v1.0.3
            - **Radial Fan-out Menu:** Replaced the large square popup with an ultra-clean radial fan-out menu that blooms directly out of the bubble.
            - **Authentic Real-Time Brand Icons:** Real app vector icons for **X (Twitter)** with the official crisp mathematical '𝕏' logo, **TikTok**, **Facebook**, **Instagram**, and **YouTube**.
            - **Minimalist Icon-Only Design:** No bulky text or large boxes — sleek circular buttons with real brand logos, haptic feedback, and fluid spring physics.
            - **Smooth Retract Animation:** Tapping the bubble again or tapping outside smoothly pulls the radial icons back inside the bubble.
            - **Side Edge-Snapping:** Floating icon docks and snaps magnetically along the sides of your screen.
            - **Background Persistence:** Keeps running even when you close the app from recent tasks.
            - **Direct APK Download:** Tap **`Bypass.apk`** below to download and install.
          files: build-output/Bypass.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
